[package]
name = "tx-simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2.5.0", default-features = false, features = ["std", "sol-types", "provider-http", "reqwest"] }
axum = "0.8.9"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
